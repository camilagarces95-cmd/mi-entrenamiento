<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#243c35"><link rel="manifest" href="manifest.webmanifest">
<title>Mi entrenamiento</title>
<style>
:root{--green:#243c35;--mint:#e8f0eb;--bg:#f6f7f5;--ink:#202722;--muted:#68736c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:var(--green);color:white;padding:24px 18px 20px;border-radius:0 0 22px 22px}
h1{font-size:25px;margin:0 0 5px}.sub{opacity:.82;font-size:13px}
main{max-width:720px;margin:auto;padding:16px}
select{padding:12px;border:1px solid #d7ded9;border-radius:12px;background:white;font-size:16px;width:100%;margin:5px 0 12px}
.card{background:white;border:1px solid #e4e9e5;border-radius:16px;padding:14px;margin:12px 0;box-shadow:0 2px 8px #20352a0a}
h2{font-size:19px;margin:4px 0 8px}.meta{font-size:13px;color:var(--muted);margin-bottom:12px}
.item{border-top:1px solid #edf0ed;padding:12px 0;display:grid;grid-template-columns:24px 1fr;gap:9px}
.item:first-of-type{border-top:0}.item input[type=checkbox]{width:19px;height:19px;accent-color:var(--green);margin-top:2px}
.name{font-weight:600}.detail{font-size:13px;color:var(--muted);margin-top:3px}
.weight{width:100px;border:1px solid #dce3de;border-radius:8px;padding:7px;margin-top:7px}
.tag{display:inline-block;background:var(--mint);color:var(--green);padding:4px 8px;border-radius:20px;font-size:12px;margin:2px}
button{background:var(--green);color:white;border:0;border-radius:12px;padding:11px 14px;font-size:14px;margin:5px 4px 5px 0}
.note{font-size:12px;color:var(--muted);line-height:1.45}
</style></head><body>
<header><h1>💪 Mi entrenamiento</h1><div class="sub">Fuerza · técnica · registro de cargas</div></header>
<main>
<label for="week"><b>Semana</b></label><select id="week"><option value="0">Semana 1 · 30 nov – 6 dic 2026</option><option value="1">Semana 2 · 7 – 13 dic 2026</option></select>
<label for="day"><b>Día</b></label><select id="day"></select>
<div id="workout"></div>
<p class="note">Tus checks y pesos se guardan en este navegador en este dispositivo. Los ejercicios sin repeticiones visibles en el material están marcados «por confirmar»; no se han inventado.</p>
<button onclick="clearDay()">Reiniciar checks de este día</button>
</main>

const days=document.getElementById('day'),week=document.getElementById('week'),out=document.getElementById('workout');
function key(){return 'mi-entrenamiento-'+week.value+'-'+days.value}
function renderDays(){days.innerHTML='';data[+week.value].forEach((d,i)=>{let o=document.createElement('option');o.value=i;o.textContent=d[0];days.append(o)});render()}
function render(){let d=data[+week.value][+days.value];let saved=JSON.parse(localStorage.getItem(key())||'{}');out.innerHTML=`<section class="card"><h2>${d[0]}</h2><div class="meta">${d[1]}</div><div><span class="tag">Marca al terminar</span><span class="tag">Anota tus cargas</span></div></section>`;
d.slice(2).forEach((raw,i)=>{let [name,detail]=raw.split('|');let id='e'+i;let val=saved[id]||{};let row=document.createElement('div');row.className='card item';row.innerHTML=`<input type="checkbox" ${val.done?'checked':''} aria-label="Completado"><div><div class="name">${name}</div><div class="detail">${detail||''}</div><input class="weight" placeholder="Peso (kg)" value="${val.weight||''}" aria-label="Peso usado"> <span class="note">peso usado</span></div>`;let cb=row.querySelector('input[type=checkbox]'),wt=row.querySelector('.weight');function save(){saved[id]={done:cb.checked,weight:wt.value};localStorage.setItem(key(),JSON.stringify(saved))}cb.addEventListener('change',save);wt.addEventListener('input',save);out.append(row)})}
function clearDay(){if(confirm('¿Reiniciar los checks y pesos de este día?')){localStorage.removeItem(key());render()}}
week.addEventListener('change',renderDays);days.addEventListener('change',render);renderDays();
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./sw.js');
